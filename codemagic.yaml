workflows:
  ios-testflight:
    name: iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    working_directory: louder_for_learning

    # In Codemagic's dashboard: Teams > Integrations > App Store Connect,
    # add an API key generated in App Store Connect (Users and Access >
    # Integrations) and name the integration "codemagic_api_key" to match
    # below (or update the name here to match what you choose).
    integrations:
      app_store_connect: codemagic_api_key

    environment:
      vars:
        BUNDLE_ID: "com.louderforlearning.app"
        XCODE_WORKSPACE: "ios/Runner.xcworkspace"
        XCODE_SCHEME: "Runner"
      flutter: stable
      xcode: latest
      cocoapods: default

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    scripts:
      - name: Initialize keychain
        script: keychain initialize

      # First run: nothing exists yet for this bundle ID in App Store
      # Connect, so --create has it generate the distribution certificate
      # and App Store provisioning profile via the API key. Later runs
      # just reuse what's already there.
      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create

      - name: Add certificates to keychain
        script: keychain add-certificates

      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles

      - name: Get Flutter packages
        script: flutter packages pub get

      - name: Install CocoaPods dependencies
        script: |
          find . -name "Podfile" -maxdepth 2 -execdir pod install \;

      - name: Flutter build ipa
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - ayushdebbhattacharyya2@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
